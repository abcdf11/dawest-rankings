name: dawest
x-core-env: &core-env
  POSTGRES_DB: ${POSTGRES_DB:-dawest}
  POSTGRES_USER: ${POSTGRES_USER:-dawest}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: postgres
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
  REDIS_URL: redis://redis:6379/0
  USE_REDIS: "1"
  COOKIE_SECURE: ${COOKIE_SECURE:-0}
  DAWEST_GAME_API_KEY: ${DAWEST_GAME_API_KEY:-}
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dawest}
      POSTGRES_USER: ${POSTGRES_USER:-dawest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        redis-server,
        --appendonly,
        "yes",
        --maxmemory,
        256mb,
        --maxmemory-policy,
        allkeys-lru,
      ]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: { context: ., dockerfile: infra/Dockerfile.django }
    environment: *core-env
    command: [python, manage.py, migrate, --noinput]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  backend:
    build: { context: ., dockerfile: infra/Dockerfile.django }
    restart: unless-stopped
    environment: *core-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health/")',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  relay:
    build: { context: ., dockerfile: infra/Dockerfile.django }
    restart: unless-stopped
    environment: *core-env
    command: [python, manage.py, relay_rankings, --loop]
    depends_on:
      migrate: { condition: service_completed_successfully }
      realtime: { condition: service_healthy }
  realtime:
    build: { context: ., dockerfile: infra/Dockerfile.node }
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      PORT: "3001"
      SOCKET_ALLOWED_ORIGINS: ${SOCKET_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3001/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: { context: ., dockerfile: infra/Dockerfile.frontend }
    restart: unless-stopped
    ports: ["8080:8080"]
    depends_on:
      backend: { condition: service_healthy }
      realtime: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
